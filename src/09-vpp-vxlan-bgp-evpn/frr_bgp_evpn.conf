! ==============================================================================
! FRRouting (FRR) BGP EVPN Control Plane Configuration
! Manages BGP EVPN (L2VPN EVPN) Type-2 (MAC/IP) and Type-5 (IP Prefix) routes
! ==============================================================================

frr version 8.5
frr defaults traditional
hostname node1-frr-evpn
log syslog informational

router bgp 65001
 bgp router-id 10.0.0.1
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 update-source loop0

 address-family l2vpn evpn
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 advertise-all-vni
  advertise-host-routes
  advertise-default-gw
 exit-address-family
!
line vty
!
